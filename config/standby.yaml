project:
  name: united-standby-analytics
  version: "0.1.0"

scope:
  hubs:
    - ORD
  default_hub: ORD
  marketing_carriers:
    - UA
  operating_carriers:
    mainline:
      - UA
    express:
      - OO  # SkyWest Airlines
      - YX  # Republic Airline
      - G7  # GoJet Airlines
      - ZW  # Air Wisconsin Airlines (2019 & H1 2023)
      - EV  # ExpressJet Airlines (2019 baseline)
      - AX  # Trans States Airlines (2019 baseline)
      - C5  # CommuteAir
      - YV  # Mesa Airlines
  years:
    - 2019
    - 2023
    - 2024
    - 2025
    - 2026

paths:
  raw_dir: data/raw
  sample_dir: data/sample
  manifest_path: data/manifest.csv
  sample_manifest_path: data/sample/manifest.csv
  processed_dir: data/processed
  reference_dir: reference
  exports_dir: exports/tableau

hour_blocks:
  early:     { start_hour: 5,  end_hour: 8,  load_multiplier: 0.96 }
  morning:   { start_hour: 8,  end_hour: 11, load_multiplier: 1.03 }
  midday:    { start_hour: 11, end_hour: 14, load_multiplier: 1.00 }
  afternoon: { start_hour: 14, end_hour: 17, load_multiplier: 1.02 }
  evening:   { start_hour: 17, end_hour: 20, load_multiplier: 1.04 }
  late:      { start_hour: 20, end_hour: 5,  load_multiplier: 0.94 }

index_weights:
  open_seats: 0.50
  displacement_pressure: 0.20
  backup_options: 0.20
  day_holiday_demand: 0.10

bigquery:
  project_id: flight-standby-analytics  # override with the GCP_PROJECT_ID env var (also read by dbt)
  location: US
  partition_expiration_ms: null  # Strictly NONE (billing-enabled project, never Sandbox)
  datasets:
    raw: raw
    staging: staging
    intermediate: intermediate
    marts: marts
  tables:
    otp_marketing_flights: otp_marketing_flights
    t100_segments: t100_segments
    faa_aircraft_registry: faa_aircraft_registry
    faa_acftref: faa_acftref
    tsa_daily_throughput: tsa_daily_throughput
    bts_lookups: bts_lookups

enrichment:
  tsa_damping_alpha: 0.35
  tsa_multiplier_bounds: [0.80, 1.20]
  min_faa_tc_max_seats: 20
  commercial_mfr_prefixes:
    - BOEING
    - AIRBUS
    - EMBRAER
    - YABORA
    - BOMBARDIER
    - CANADAIR
    - MHI RJ
  dedicated_express_carriers:
    - G7
    - EV
    - AX
    - C5
  shared_cpa_express_carriers:
    - OO
    - YX
    - YV
    - ZW  # Multi-brand starting 2023; dedicated UA in 2019
  hour_block_multipliers:
    early: 0.96
    morning: 1.03
    midday: 1.00
    afternoon: 1.02
    evening: 1.04
    late: 0.94

sanity_checks:
  departure_reconciliation_tolerance: 0.10
  seats_per_dep_warn_tolerance: 0.10
  seats_per_dep_fail_tolerance: 0.15
  system_lf_warn_bounds: [0.80, 0.86]
  system_lf_fail_bounds: [0.75, 0.90]
  sample_lf_fail_bounds: [0.70, 0.92]
  sample_min_t100_rows: 500

scoring:
  open_seats_abs_cap: 25.0
  open_seats_pct_cap: 0.30
  open_seats_abs_weight: 0.50
  disp_diversion_weight: 0.50
  disp_decay_base: 0.75
  disp_hist_cap: 2.0
  disp_plan_prior_factor: 0.65
  disp_plan_cap: 0.25
  disp_plan_min_obs: 5
  backup_max_flights: 6
  demand_holiday_adder: 0.10
  demand_ratio_min: 0.65
  demand_ratio_max: 1.35

export:
  tableau_flight_mode: stratified
  tableau_flight_max_rows: 100000
  tableau_stratify_seed: 42
  tableau_float_precision: 4
  tableau_max_file_mb: 50.0

prediction:
  shrinkage_pseudo_count: 10.0
  simulation_draws: 2000
  simulation_seed: 42
  hub_irrops_corr: 0.35
  spillover_seats_per_cancel: 18.0
  spillover_decay: 0.50
  hub_to_hub_destinations:
    - DEN
    - EWR
    - IAH
    - SFO
    - IAD
    - LAX
  hub_to_hub_queue_multiplier: 1.45
  pass_tier_queue_means:
    SA1P: 0.8
    SA2: 2.5
    SA3: 5.0
    BUDDY: 8.5
  horizon_volatility_scale:
    gt_72h: 1.00
    h24_72: 0.65
    h6_24: 0.35
    lt_6h: 0.15
