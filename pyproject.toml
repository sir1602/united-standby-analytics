[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "united-standby-analytics"
version = "0.1.0"
description = "United Airlines Standby Opportunity Analytics (ORD Departures) — ELET Pipeline, Enrichment & SOI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Portfolio Author" }
]
dependencies = [
  "pandas>=2.1,<3.0",
  "pyarrow>=14.0",
  "pandera>=0.18",
  "pyyaml>=6.0",
  "click>=8.1",
  "google-cloud-bigquery>=3.17",
  "db-dtypes>=1.2",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "dbt-core>=1.7,<1.9",
  "dbt-bigquery>=1.7,<1.9",
]

[project.scripts]
standby = "standby.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/standby"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
