name: CI

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches:
      - main

jobs:
  lint-test-parse:
    name: Ruff, Pytest (Sample) & dbt Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: .venv/bin/ruff check src/ tests/

      - name: Check formatting with ruff
        run: .venv/bin/ruff format --check src/ tests/

      - name: Verify sample manifest
        run: .venv/bin/python -m standby verify-manifest --manifest data/sample/manifest.csv

      - name: Run pytest suite on data/sample/
        run: .venv/bin/pytest -v

      - name: Run CLI end-to-end sample dry-run
        run: .venv/bin/python -m standby run --hub ORD --years 2019,2023-2026 --sample --dry-run

      - name: Validate dbt project (offline parse)
        run: .venv/bin/dbt parse --project-dir dbt --profiles-dir dbt --no-send-anonymous-usage-stats --no-populate-cache

      - name: Validate dbt SQL compilation (offline compile)
        run: .venv/bin/dbt compile --project-dir dbt --profiles-dir dbt --no-send-anonymous-usage-stats --no-populate-cache

      - name: Generate dbt catalog docs (offline empty-catalog)
        run: .venv/bin/dbt docs generate --empty-catalog --project-dir dbt --profiles-dir dbt --no-send-anonymous-usage-stats --no-populate-cache
