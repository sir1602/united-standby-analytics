united_standby_analytics:
  target: ci
  outputs:
    ci:
      type: bigquery
      method: oauth-secrets
      token: "{{ env_var('DBT_BQ_TOKEN', 'offline-ci-placeholder') }}"
      project: "{{ env_var('GCP_PROJECT_ID', 'flight-standby-analytics') }}"
      dataset: marts
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'flight-standby-analytics') }}"
      dataset: marts
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
